name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Unified-Assignments1-1269-bwilliams"
          path: "."
          format: "SARIF"
          out: "dependency-check-report"
          args: >
            --enableExperimental
            --exclude "**/venv/**"
            --failOnCVSS 7
            --enableRetired

      - name: Upload Dependency-Check Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ./dependency-check-report/dependency-check-report.sarif
          if-no-files-found: error
          
  docker-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t library-api:ci .

      - name: Manual Trivy Setup
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true
          version: v0.70.0

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'library-api:ci'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          skip-setup-trivy: true

      - name: Run container
        run: docker run -d -p 8080:8080 library-api:ci

      - name: Test endpoints
        run: |
          sleep 5
          curl --fail http://localhost:8080/health
          curl --fail http://localhost:8080/books    

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to Amazon ECR
        run: |
          docker tag library-api:ci 808949116514.dkr.ecr.us-east-1.amazonaws.com/library-api:v1
          docker push 808949116514.dkr.ecr.us-east-1.amazonaws.com/library-api:v1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag library-api:ci brandon8721/library-api:v1
          docker push brandon8721/library-api:v1