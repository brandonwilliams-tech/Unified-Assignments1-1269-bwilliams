name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          . venv/bin/activate
          pip install pytest
          python -m pytest

  sast-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep Scan
        run: |
          semgrep --config p/ci --sarif --output semgrep-results.sarif --error --severity ERROR

      - name: Upload Semgrep Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-results.sarif
          if-no-files-found: error

  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Unified-Assignments1-1269-bwilliams"
          path: "."
          format: "SARIF"
          out: "dependency-check-report"
          args: >
            --enableExperimental
            --exclude "**/venv/**"
            --failOnCVSS 7
            --enableRetired

      - name: Upload Dependency-Check Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ./dependency-check-report/dependency-check-report.sarif
          if-no-files-found: error
          
  docker-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t library-api:ci .

      - name: Manual Trivy Setup
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true
          version: v0.70.0

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'library-api:ci'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          skip-setup-trivy: true

      - name: Run container
        run: docker run -d -p 8080:8080 library-api:ci

      - name: Test endpoints
        run: |
          sleep 5
          curl --fail http://localhost:8080/health
          curl --fail http://localhost:8080/books    